# Copy to .github/workflows/terraform.yml in an infrastructure repository.
# plan -> plan JSON -> Infracost cost estimate -> tfpolicy -> (only if it passed) apply.
name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  plan-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write        # OIDC login to AWS (see Problem #4)
      pull-requests: write   # post the policy report on the pull request
    defaults:
      run:
        working-directory: ${{ vars.TF_WORKING_DIR || 'infra' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      - name: Terraform plan
        run: |
          terraform init -input=false
          terraform plan -input=false -out=plan.out
          terraform show -json plan.out > plan.json

      - name: Cost estimate (Infracost)
        uses: infracost/actions/setup@a5783eb98adc93aa7a0049fce0abb06fdd30770a # v5.0.1
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - run: infracost breakdown --path plan.json --format json --out-file infracost.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Policy check (fails the job on violations)
        env:
          TFPOLICY_DIR: ${{ github.workspace }}/tools/tfpolicy   # where you vendored this tool
        run: |
          pip install -r "$TFPOLICY_DIR/requirements.txt"
          PYTHONPATH="$TFPOLICY_DIR" python -m tfpolicy plan.json \
            --policy "$TFPOLICY_DIR/policies/default.yaml" \
            --infracost infracost.json \
            --markdown-output policy-report.md

      - name: Post the report on the pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('**/policy-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file policy-report.md --edit-last --create-if-none
