[project]
name = "tfpolicy"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["tfpolicy", "helpers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
